  work:
    - name: Shanghai Qianhui Technology Co., Ltd.
      position: Open-source Software Engineer Intern (Cherry Studio)
      startDate: Jun 1, 2026
      summary: |
        Maintain the 50k+ star cross-platform Cherry Studio AI desktop client within the startup behind the project
        - Deliver features and fixes across Agent Runtime, models and providers, Code CLI integrations, data migration, and desktop interaction layers
        - Landed 42 commits in the main repository during summer 2026, including system skill discovery, an image-generation agent tool, provider-aware speed controls, and interactive QR authentication
        - Expanded native integrations for Kimi Code, Qoder, Claude Code, and OpenClaw while addressing user-data migration, dependency security, and API key protection

    - name: Ningbo Global Innovation Center, Zhejiang University
      position: Research Intern
      startDate: Jun 1, 2025
      endDate: Aug 15, 2025
      summary: |
        - Reimplemented the Mamba-TasNet speech separation pipeline to align with published benchmarks across Mandarin and English datasets
        - Automated data preprocessing and mixed-precision training workflows, improving iteration speed on the centre's compute cluster
        - Delivered weekly experiment updates to the research group to inform deployment plans for forthcoming pilots

    - name: Department of Computer Science, University of Nottingham Ningbo China
      position: FoSE Undergraduate Research Practice Intern
      startDate: Jun 2, 2025
      endDate: Aug 15, 2025
      summary: |
        Faculty of Science and Engineering Student Extra-Curriculum Programme 2024–2025 · Undergraduate Research Practice (In-semester Round) · Supervisor: Chin Poo Lee
        - Integrated U-Net's encoder-decoder design with Mamba selective state-space modelling in an nnU-Net-based BTCV multi-organ segmentation pipeline
        - Improved Dice from 82.33 to 83.94 and reduced 95HD from 6.92 to 5.68 versus nnU-Net, while cutting parameters from 88M to 60M
        - Reproduced models, conducted quantitative and qualitative evaluation, and delivered the final research poster across CNN, Vision Mamba, Vision Transformer, and U-Net methods

    - name: Shanghai Huorong Information Technology Co., Ltd.
      position: Front-end Engineer Intern
      startDate: Apr 1, 2025
      endDate: May 15, 2025
      summary: |
        Led front-end development of the Plants vs. Zombies 2 UGC upload platform end-to-end:
        - Built high-fidelity UI using shadcn-vue, lucide-vue-next, and Tailwind CSS
        - Implemented navigation with Vue Router and unified Axios interceptors for request forwarding and authentication
        - Deployed front-end and back-end test environments, validated request/response models against API documentation, and resolved cross-origin integration issues
        - Collaborated with QA on unit testing, bug fixes, and performance improvements

    - name: Jiangsu Itcast Education Technology Co., Ltd.
      position: Java Development Engineer Intern
      startDate: Apr 1, 2024
      endDate: May 12, 2024
      summary: |
        - Applied Java knowledge to production-oriented development tasks within the Product Development Department and delivered assigned work on schedule
        - Collaborated with supervisors and colleagues on requirements, problem-solving, and day-to-day engineering delivery

  projects:
    - name: Cherry Studio
      url: https://github.com/CherryHQ/cherry-studio
      description: Cross-platform AI Desktop Client · Core Contributor
      startDate: Feb 1, 2025
      summary: |
        Large-scale open-source project · 50k+ GitHub Stars · Electron + React + TypeScript
        - Agent capabilities: implemented system skill discovery, an image-generation Agent/Chat tool, interactive QR authentication for channels, and endpoint routing for mixed-provider models
        - CLI ecosystem: evolved Kimi Code, Qoder, Claude Code, and OpenClaw integrations with native configuration persistence and feature parity
        - Data and architecture: completed pre-boot user-data relocation, migrated ImportService from Redux to DataApi, and protected user-default models during reconciliation
        - Reliability and security: fixed editor, message-selection, conversation-tab, and provider-setting issues while resolving critical dependency vulnerabilities and hardening API key handling
      keywords:
        - Electron
        - React
        - TypeScript

    - name: Assay
      url: https://github.com/Pleasurecruise/assay
      description: Strategy Credibility Audit Agent · Third Prize, AdventureX 2026 PandaAI Trading Track
      startDate: Jul 22, 2026
      endDate: Jul 26, 2026
      summary: |
        Built an independent quality-assurance layer for AI trading ecosystems that validates alpha claims without recommending securities, predicting markets, or promising returns
        - Designed five isolated checks running in parallel across parameter robustness, data availability, transaction-cost stress, market-regime dependency, and signal homogeneity/decay
        - Introduced Moiré cross-validation to resolve conflicting findings through discriminating follow-up experiments, followed by deterministic five-level verdicts and reproducible evidence
        - Implemented natural-language intake, deterministic StrategySpec validation and freezing, a structured backtester, and versioned JSON/Markdown Artifacts
        - Packaged the system as an A2A Remote Agent with task-state streaming and protocol-level cancellation for multi-agent trading workflows
      keywords:
        - A2A
        - TypeScript
        - React
        - Python
        - Bun

    - name: Cherry Studio App
      url: https://github.com/CherryHQ/cherry-studio-app
      description: Cross-platform Mobile AI Client · Core Contributor
      startDate: Feb 1, 2025
      summary: |
        Open-source · 3k+ GitHub Stars · Expo + React Native
        - Designed global state for conversation history, model state, and user preferences with Redux Toolkit and asynchronous middleware
        - Built core conversation-list, message-detail, and model-switching components with adaptive dark and light themes
        - Integrated Drizzle ORM as a lightweight local data layer for offline history access and configuration caching
      keywords:
        - React Native
        - Expo
        - TypeScript

    - name: my-memos
      url: https://github.com/Pleasurecruise/my-memos
      description: Cloud-native Personal Knowledge App with AI and MCP
      startDate: May 11, 2026
      summary: |
        Independently designed and deployed a personal knowledge product at memos.you-find.me
        - Built a full-stack SvelteKit application on Cloudflare Workers, using D1 for indexes and searchable mirrors, R2 for canonical Markdown, and KV for disposable caches
        - Integrated Better Auth with Google OAuth, single-user allowlisting, and server-side boundary validation for private data
        - Added context-aware AI chat through Cloudflare AI Gateway with tools for searching, creating, updating, and deleting memos
        - Exposed an API-key-protected Streamable HTTP MCP service and covered MCP, authorisation, message streaming, and storage services with unit tests
      keywords:
        - SvelteKit
        - Cloudflare Workers
        - MCP
        - Drizzle ORM

    - name: my-moment
      url: https://github.com/Pleasurecruise/my-moment
      description: Cloud-native Personal Space for Photos, Journeys, and Collections
      startDate: Jun 6, 2026
      summary: |
        Independently designed and deployed a multi-module personal product at moment.you-find.me
        - Built gallery, journey map, guestbook, and collection/wishlist modules with SolidJS, Hono, and Cloudflare Workers
        - Implemented browser-side HEIC/HEIF conversion, batch uploads, and masonry/list views, with R2, D1, and KV separating media, business data, and caches
        - Integrated Mapbox travel footprints, Better Auth, and a threaded infinite-scroll guestbook, backed by database migrations, CI, and service-level tests
      keywords:
        - SolidJS
        - Hono
        - Cloudflare Workers
        - Mapbox

    - name: NottinghamWall
      url: https://github.com/CompPsyUnion/NottinghamWall
      description: Campus WeChat Mini-program · Founder and Lead Developer
      startDate: Jun 1, 2024
      endDate: Dec 31, 2024
      summary: |
        Designed and delivered a multi-client open-source campus forum, reaching 150+ users and 250+ GitHub Stars
        - Built the RESTful API with Spring Boot and MyBatis, the administration console with Vue 3 and Element Plus, and the WeChat client with UniApp
        - Designed a three-tier JWT-based RBAC system and integrated WeChat sensitive-word detection with Alibaba Cloud OSS image moderation
        - Optimised topic-feed scrolling with virtual lists and owned the product lifecycle from system design and deployment through early operations
      keywords:
        - Spring Boot
        - Vue 3
        - UniApp

