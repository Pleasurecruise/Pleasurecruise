  work:
    - name: 上海千慧科技有限公司
      position: 开源软件工程师实习生（Cherry Studio）
      startDate: Jun 1, 2026
      endDate: Aug 31, 2026
      summary: |
        在 Cherry Studio 背后的创业团队持续维护 50k+ Stars 跨平台 AI 桌面客户端
        - 负责 Agent Runtime、模型与 Provider、Code CLI、数据迁移及桌面端交互等核心模块的功能迭代与缺陷修复
        - 2026 年暑期交付系统 Skills 发现、Agent 图像生成工具、Provider 感知速度控制与交互式 QR 鉴权等能力
        - 完善 Kimi Code、Qoder、Claude Code、OpenClaw 等原生 CLI 集成，并处理用户数据迁移、依赖安全与 API Key 防护问题

    - name: 浙大宁波科创中心
      position: 研究实习生
      startDate: Jun 1, 2025
      endDate: Aug 15, 2025
      summary: |
        - 重新实现 Mamba-TasNet 语音分离流程，使其与已发表的中英文数据集研究基准保持一致
        - 自动化数据预处理和混合精度训练工作流程，提升中心计算集群的迭代速度
        - 每周向研究小组汇报实验进展，为即将进行的试点项目提供部署计划信息

    - name: 宁波诺丁汉大学计算机科学系
      position: 本科生科研实习生（FoSE FURP）
      startDate: Jun 2, 2025
      endDate: Aug 15, 2025
      summary: |
        Faculty of Science and Engineering Student Extra-Curriculum Programme 2024–2025 · Undergraduate Research Practice (In-semester Round) · 导师：Chin Poo Lee
        - 基于 nnU-Net 将 U-Net 编解码结构与 Mamba 选择性状态空间机制结合，完成 BTCV 多器官医学影像分割实验
        - 相比 nnU-Net 基线，Dice 从 82.33 提升至 83.94，95HD 从 6.92 降至 5.68，参数量由 88M 降至 60M
        - 完成模型复现、定量/定性评估与研究海报交付，覆盖 CNN、Vision Mamba、Vision Transformer 与 U-Net 技术调研

    - name: 上海火溶信息科技有限公司
      position: 前端工程师实习生
      startDate: Apr 1, 2025
      endDate: May 15, 2025
      summary: |
        参与“植物大战僵尸 2 UGC 上传系统”的需求分析、系统设计与编码实现，主导前端开发：
        - 使用 shadcn-vue、lucide-vue-next 与 Tailwind CSS 完成高还原度 UI 开发
        - 使用 Vue Router 实现页面导航，封装 Axios 拦截器统一处理请求转发与鉴权逻辑
        - 部署前后端测试环境，验证请求/响应模型与接口文档一致性，解决跨域通信与联调问题
        - 配合测试团队完成单元测试、Bug 修复与性能优化

    - name: 江苏传智播客教育科技股份有限公司
      position: Java 开发工程师实习生
      startDate: Apr 1, 2024
      endDate: May 12, 2024
      summary: |
        - 在产品研发部门参与 Java 开发实践，将所学知识应用于实际研发任务并按期完成交付
        - 配合主管与团队推进开发工作，在需求理解、问题分析与协作沟通中积累工程经验

  projects:
    - name: Cherry Studio
      url: https://github.com/CherryHQ/cherry-studio
      description: 跨平台 AI 桌面客户端 · 核心贡献者
      startDate: Feb 1, 2025
      summary: |
        大型开源项目 · GitHub 50k+ Stars · Electron + React + TypeScript
        - Agent 能力：实现系统 Skills 发现与启用、图像生成 Agent/Chat Tool、Channel 交互式 QR 鉴权及多 Provider 模型端点路由
        - CLI 生态：完成 Kimi Code、Qoder、Claude Code、OpenClaw 等集成迭代，统一原生配置持久化与功能对齐
        - 数据与架构：实现用户数据预启动迁移，将 ImportService 从 Redux 迁移至 DataApi，并保护同步过程中的用户默认模型
        - 稳定性与安全：修复编辑器、消息选择、会话标签与 Provider 设置问题，处理关键依赖漏洞及 API Key 掩码/字符校验
      keywords:
        - Electron
        - React
        - TypeScript

    - name: Assay
      url: https://github.com/Pleasurecruise/assay
      description: 策略可信度审计 Agent · AdventureX 2026 PandaAI「交易未来」量化交易赛道三等奖
      startDate: Jul 22, 2026
      endDate: Jul 26, 2026
      summary: |
        面向 AI 交易生态构建独立的策略质检层，验证策略 Alpha 的可信度，不推荐证券、不预测市场或承诺收益
        - 设计五路隔离并行审计流水线，覆盖参数稳健性、数据可得性、交易成本压力、市场环境依赖及信号同质化与衰减
        - 提出 Moiré 交叉验证机制，通过判别性追加实验裁决审计矛盾，并以确定性规则输出五级判决、恢复条件与可复现证据
        - 实现自然语言策略接入、StrategySpec 确定性校验与冻结、结构化回测器及版本化 JSON/Markdown Artifact
        - 基于官方 A2A SDK 封装 Remote Agent，支持任务状态流转与协议级取消，可作为独立审计节点接入多 Agent 交易工作流
      keywords:
        - A2A
        - TypeScript
        - React
        - Python
        - Bun

    - name: Cherry Studio App
      url: https://github.com/CherryHQ/cherry-studio-app
      description: 跨平台移动端 AI 客户端 · 核心贡献者
      startDate: Feb 1, 2025
      summary: |
        开源社区贡献 · GitHub 3k+ Stars · Expo + React Native
        - 使用 Redux Toolkit 设计对话历史、模型状态与用户配置的全局状态架构，通过异步中间件保障一致性
        - 开发对话列表、消息详情、模型切换面板等核心组件，实现暗色/亮色主题自适应
        - 集成 Drizzle ORM 构建轻量本地数据层，支持离线查看历史会话与配置缓存
      keywords:
        - React Native
        - Expo
        - TypeScript

    - name: my-memos
      url: https://github.com/Pleasurecruise/my-memos
      description: 支持 AI 与 MCP 的云原生个人笔记应用
      startDate: May 11, 2026
      summary: |
        独立设计并上线个人知识管理产品（memos.you-find.me）
        - 基于 SvelteKit + Cloudflare Workers 构建全栈应用，以 D1 维护索引与检索镜像、R2 存储 Markdown 原文、KV 承载可丢弃缓存
        - 接入 Better Auth + Google OAuth，并通过单用户白名单与服务端边界校验保护私有数据
        - 集成 Cloudflare AI Gateway，提供可调用检索、创建、更新与删除工具的上下文感知 AI 对话
        - 实现带 API Key 鉴权的 Streamable HTTP MCP 服务，并以单元测试覆盖 MCP、权限、消息流与存储服务
      keywords:
        - SvelteKit
        - Cloudflare Workers
        - MCP
        - Drizzle ORM

    - name: my-moment
      url: https://github.com/Pleasurecruise/my-moment
      description: 记录影像、旅程与收藏的云原生个人空间
      startDate: Jun 6, 2026
      summary: |
        独立设计并上线多模块生活记录产品（moment.you-find.me）
        - 使用 SolidJS、Hono 与 Cloudflare Workers 构建图库、旅行地图、留言板及收藏/愿望单模块
        - 实现 HEIC/HEIF 浏览器端转换、批量图片上传与瀑布流/列表视图，并以 R2、D1、KV 分层处理媒体、业务数据与缓存
        - 集成 Mapbox 旅行足迹、Better Auth 身份认证、回复式无限滚动留言板，并通过数据库迁移、CI 与服务层测试保障交付
      keywords:
        - SolidJS
        - Hono
        - Cloudflare Workers
        - Mapbox

    - name: NottinghamWall
      url: https://github.com/CompPsyUnion/NottinghamWall
      description: 校园墙微信小程序 · 独立发起并主导开发
      startDate: Jun 1, 2024
      endDate: Dec 31, 2024
      summary: |
        为解决校内技术交流平台缺失问题，设计开发多端开源论坛系统，累计用户 150+、GitHub 250+ Stars
        - 使用 Spring Boot + MyBatis 构建 RESTful API，Vue 3 + Element Plus 开发管理后台，UniApp 实现微信小程序端
        - 设计基于 JWT 的三级 RBAC 权限体系，集成微信敏感词检测与阿里云 OSS 图片违规审核
        - 通过虚拟列表优化话题流滚动性能，完成从系统设计、开发部署到早期运营的产品闭环
      keywords:
        - Spring Boot
        - Vue 3
        - UniApp

